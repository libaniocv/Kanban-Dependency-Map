name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: npm run build && git diff --exit-code -- dashboard/dist/index.js
      - run: python -m pip install 'fastapi>=0.110,<1' 'pytest>=8,<10'
      - run: python -m pytest -q tests/test_plugin_api.py
      - run: python -m compileall -q dashboard/plugin_api.py __init__.py
