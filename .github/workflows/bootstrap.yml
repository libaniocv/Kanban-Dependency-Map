name: Import plugin sources
on:
  push:
    paths:
      - .bootstrap.json.zlib.b64
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore plugin and remove bootstrap
        run: |
          python3 - <<'PY'
          import base64, json, pathlib, zlib
          root = pathlib.Path('.')
          payload = (root / '.bootstrap.json.zlib.b64').read_text().strip()
          files = json.loads(zlib.decompress(base64.b64decode(payload)).decode('utf-8'))
          for name, content in files.items():
              dest = root / name
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_text(content, encoding='utf-8')
          dist = root / 'dashboard/dist/index.js'
          dist.parent.mkdir(parents=True, exist_ok=True)
          dist.write_text(
              '/* Kanban Dependency Map v1.0.0 — generated by node scripts/build.mjs */\n'
              '(function () {\n"use strict";\n'
              + files['src/layout.js'] + '\n\n'
              + files['src/plugin.js'] + '\n})();\n', encoding='utf-8'
          )
          (root / '.bootstrap.json.zlib.b64').unlink()
          (root / '.github/workflows/bootstrap.yml').unlink()
          PY
      - name: Commit completed plugin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish Kanban Dependency Map plugin" 
          git push
